    <title>ร้องเลย — คาราโอเกะเพลงไทย</title>
    <!-- หน้าจอเปิดแอป: แสดงไอคอนทันทีระหว่างโหลด (ไม่ต้องรอ JS/CSS) -->
    <style>
      html,
      body {
        margin: 0;
        background: #0d0b1a;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-bottom: 6vh;
        background:
          radial-gradient(60% 45% at 50% 42%, rgba(255, 79, 163, 0.22), transparent 70%),
          radial-gradient(70% 55% at 50% 60%, rgba(123, 92, 255, 0.18), transparent 75%),
          #0d0b1a;
        color: #f4f1ff;
        font-family: Kanit, 'Sarabun', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-logo {
        width: 104px;
        height: 104px;
        border-radius: 28px;
        box-shadow: 0 16px 48px rgba(255, 79, 163, 0.45);
        animation: splash-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) both, splash-breathe 1.8s ease-in-out 0.5s infinite;
      }
      #splash .splash-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #splash .splash-name {
        margin-top: 8px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.01em;
        animation: splash-up 0.5s ease-out 0.1s both;
      }
      #splash .splash-sub {
        color: #a9a3c9;
        font-size: 15px;
        animation: splash-up 0.5s ease-out 0.18s both;
      }
      #splash .splash-dots {
        display: flex;
        gap: 7px;
        margin-top: 18px;
      }
      #splash .splash-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4fa3;
        opacity: 0.35;
        animation: splash-dot 1s ease-in-out infinite;
      }
      #splash .splash-dots i:nth-child(2) {
        background: #b65cff;
        animation-delay: 0.15s;
      }
      #splash .splash-dots i:nth-child(3) {
        background: #7b5cff;
        animation-delay: 0.3s;
      }
      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
      }
      @keyframes splash-breathe {
        50% {
          transform: scale(1.05);
          box-shadow: 0 18px 60px rgba(255, 79, 163, 0.6);
        }
      }
      @keyframes splash-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes splash-dot {
        50% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="กำลังเปิดร้องเลย">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="splash-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff4fa3" />
              <stop offset="1" stop-color="#7b5cff" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="url(#splash-g)" />
          <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round">
            <rect x="24" y="12" width="16" height="26" rx="8" fill="#fff" />
            <path d="M16 30a16 16 0 0 0 32 0M32 46v7" />
          </g>
        </svg>
      </div>
      <div class="splash-name">ร้องเลย</div>
      <div class="splash-sub">คาราโอเกะเพลงไทย</div>
      <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
