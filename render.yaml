# Render Blueprint — เว็บ static (ไม่ต้องมีเซิร์ฟเวอร์)
# วิธีใช้: Render Dashboard → New → Blueprint → เลือก repo นี้
services:
  - type: web
    name: rong-loei-karaoke
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # ไฟล์ใน assets/ มี hash ในชื่อ เก็บแคชได้นาน
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
